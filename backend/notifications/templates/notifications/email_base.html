<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>{{ titre }}</title></head>
<body style="margin:0;padding:0;background:#f3f5f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f8;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#1f4e79;color:#ffffff;padding:18px 24px;font-size:18px;font-weight:bold;">
          Plateforme de gestion des stages
        </td></tr>
        <tr><td style="padding:24px;font-size:15px;line-height:1.55;">
          <h2 style="margin:0 0 16px 0;font-size:18px;color:#1f4e79;">{{ titre }}</h2>
          <p>Bonjour {{ destinataire_nom }},</p>
          {% block contenu %}<p>{{ message }}</p>{% endblock %}
          <p style="margin:24px 0;">
            <a href="{{ lien_complet }}" style="background:#1f4e79;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:6px;display:inline-block;">Ouvrir sur la plateforme</a>
          </p>
        </td></tr>
        <tr><td style="padding:14px 24px;background:#f3f5f8;font-size:12px;color:#6b7785;">
          Ce message est envoyé automatiquement, merci de ne pas y répondre.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
